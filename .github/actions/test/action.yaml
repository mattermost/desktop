name: "test-ci"
description: This action used to run universal tests for all OS

inputs:
  shell:
    description: The shell to run the test
    required: true
    default: bash

runs:
  using: "composite"
  steps:
    - name: ci/run-eslint
      run: npm run lint:js-quiet
      shell: ${{ inputs.shell }}
    - name: ci/run-check-types
      run: npm run check-types
      shell: ${{ inputs.shell }}
    - name: ci/run-i18n-check
      shell: ${{ inputs.shell }}
      run: |
        npm run i18n-extract -- --desktop-dir .
        git --no-pager diff --exit-code i18n/en.json
    # Electron 43 dropped its postinstall script and downloads the binary lazily
    # on the first `require('electron')`. Jest workers each hit that path in
    # parallel and race extracting dist/Electron.app (EEXIST). Install it once,
    # single-threaded, before the test run.
    - name: ci/install-electron-binary
      shell: ${{ inputs.shell }}
      run: node node_modules/electron/install.js
    - name: ci/run-unit-ci
      shell: ${{ inputs.shell }}
      env:
        ELECTRON_DISABLE_SANDBOX: "1"
      run: |
        npm run test:unit
