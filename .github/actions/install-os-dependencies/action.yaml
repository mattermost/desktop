name: 'Install OS Dependencies'
description: 'Installs OS-specific dependencies for E2E tests'

inputs:
  os:
    description: 'Operating system (Linux, macOS, Windows)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      if: inputs.os == 'Linux'
      shell: bash
      run: |
        # Install yq binary. The old Wine repository key is unused.
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.20.1/yq_linux_amd64 && chmod a+x /usr/local/bin/yq

        # Update package lists
        sudo apt-get update || true

        # Install required packages
        sudo apt-get install -y \
          build-essential \
          clang \
          libdbus-1-dev \
          libgtk-3-dev \
          libnotify-dev \
          libasound2-dev \
          libcap-dev \
          libcups2-dev \
          libxtst-dev \
          libxss1 \
          libnss3-dev \
          curl \
          gperf \
          bison \
          python3-dbusmock \
          ca-certificates \
          libpng++-dev \
          gcc-12-aarch64-linux-gnu \
          g++-12-aarch64-linux-gnu \
          jq \
          icnsutils \
          graphicsmagick \
          tzdata \
          xsel \
          xvfb \
          x11-utils \
          libgtk-3-0t64 \
          libnss3 \
          libasound2t64 \
          dbus \
          dbus-x11 \
          libxtst6

    - name: Install macOS Dependencies
      if: inputs.os == 'macOS'
      shell: bash
      run: |
        # GitHub-hosted macOS runners ship aws/tap and azure/bicep pre-tapped.
        # Trust them so Homebrew does not warn on every brew invocation.
        brew trust aws/tap azure/bicep 2>/dev/null || true
        brew install nss
