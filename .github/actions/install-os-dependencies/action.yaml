name: 'Install OS Dependencies'
description: 'Installs OS-specific dependencies for E2E tests'

inputs:
  os:
    description: 'Operating system (Linux, macOS, Windows)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      if: inputs.os == 'Linux'
      shell: bash
      run: |
        # Install yq binary. The old Wine repository key is unused.
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.20.1/yq_linux_amd64 && chmod a+x /usr/local/bin/yq

        # Retry and time out stalled mirror requests instead of hanging the shard.
        APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)

        # Update package lists
        sudo apt-get "${APT_OPTS[@]}" update || true

        # 22.04 still ships libgtk-3-0. 24.04 and newer only have libgtk-3-0t64.
        . /etc/os-release
        gtk_package=libgtk-3-0t64
        if [ "${VERSION_ID}" = "22.04" ]; then
          gtk_package=libgtk-3-0
        fi

        # Install required packages. E2E builds and runs x64 only: the arm64 cross
        # toolchain (package:linux:arch-arm64) is not installed here.
        sudo apt-get "${APT_OPTS[@]}" install -y \
          build-essential \
          clang \
          libdbus-1-dev \
          libgtk-3-dev \
          libnotify-dev \
          libasound2-dev \
          libcap-dev \
          libcups2-dev \
          libxtst-dev \
          libxss1 \
          libnss3-dev \
          curl \
          gperf \
          bison \
          python3-dbusmock \
          ca-certificates \
          libpng++-dev \
          jq \
          icnsutils \
          graphicsmagick \
          tzdata \
          xsel \
          xvfb \
          x11-utils \
          "${gtk_package}" \
          libnss3 \
          libasound2t64 \
          dbus \
          dbus-x11 \
          libxtst6

    - name: Install macOS Dependencies
      if: inputs.os == 'macOS'
      shell: bash
      run: |
        # GitHub-hosted macOS runners ship aws/tap and azure/bicep pre-tapped.
        # Trust them so Homebrew does not warn on every brew invocation.
        brew trust aws/tap azure/bicep 2>/dev/null || true
        brew install nss
